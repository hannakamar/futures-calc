<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Futures Planner Pro</title>
    <style>
        :root { 
            --bg: #0f172a; --card: #1e293b; --input: #0f172a; 
            --accent: #38bdf8; --text: #f8fafc; --success: #10b981; --danger: #ef4444; 
        }
        
        body { font-family: -apple-system, system-ui, sans-serif; padding: 15px; background: var(--bg); color: var(--text); display: flex; justify-content: center; margin: 0; }
        .calc-card { background: var(--card); padding: 20px; border-radius: 20px; width: 100%; max-width: 480px; border: 1px solid #334155; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        
        label { display: block; font-size: 0.65rem; color: #94a3b8; margin-bottom: 8px; text-transform: uppercase; font-weight: 800; letter-spacing: 0.5px; }
        .btn-group, .chip-grid { display: grid; gap: 8px; margin-bottom: 20px; }
        .btn-group { grid-template-columns: 1fr 1fr; }
        .chip-grid { grid-template-columns: repeat(3, 1fr); }
        
        .btn-opt { 
            padding: 12px; border-radius: 10px; background: #334155; border: 2px solid transparent;
            color: #94a3b8; font-size: 0.85rem; font-weight: 700; text-align: center; cursor: pointer; transition: 0.1s;
        }
        
        .btn-opt.active-blue { border-color: var(--accent); background: #1e3a8a; color: white; }
        .btn-opt.active-green { border-color: #059669; background: #064e3b; color: #a7f3d0; }
        .btn-opt.active-red { border-color: #b91c1c; background: #7f1d1d; color: #fecaca; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        input { 
            width: 100%; padding: 14px; margin-bottom: 15px; border: 1px solid #334155; border-radius: 10px; 
            background: var(--input); color: white; box-sizing: border-box; font-size: 16px; -webkit-appearance: none;
        }
        input:focus { border-color: var(--accent); outline: none; }

        .result-box { margin-top: 5px; padding: 20px; border-radius: 12px; background: rgba(15, 23, 42, 0.8); border-left: 4px solid var(--accent); }
        .profit { color: var(--success); font-weight: 800; font-size: 1.2rem; }
        .loss { color: var(--danger); font-weight: 800; font-size: 1.2rem; }
        
        .rr-line { margin-top: 15px; padding-top: 12px; border-top: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        .rr-val { background: var(--accent); color: #0f172a; padding: 4px 12px; border-radius: 6px; font-weight: 900; }
        
        .btn-clear { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid #334155; background: transparent; color: #64748b; font-weight: 600; margin-top: 15px; }
        
        /* Quote Style */
        .quote-container { margin-top: 25px; text-align: center; padding: 10px; border-top: 1px solid #334155; }
        #quote-text { font-style: italic; color: #64748b; font-size: 0.8rem; line-height: 1.4; }
    </style>
</head>
<body>

<div class="calc-card">
    <label>Asset</label>
    <div class="chip-grid" id="assetSelector">
        <div class="btn-opt active-blue" onclick="selectAsset('es', this)">ES / MES</div>
        <div class="btn-opt" onclick="selectAsset('nq', this)">NQ / MNQ</div>
        <div class="btn-opt" onclick="selectAsset('cl', this)">CL / MCL</div>
        <div class="btn-opt" onclick="selectAsset('gc', this)">GC / MGC</div>
        <div class="btn-opt" onclick="selectAsset('si', this)">SI / SIL</div>
    </div>

    <div class="grid">
        <div>
            <label>Contract</label>
            <div class="btn-group">
                <div id="btn-std" class="btn-opt active-blue" onclick="setType('standard')">MINI</div>
                <div id="btn-mic" class="btn-opt" onclick="setType('micro')">MICRO</div>
            </div>
        </div>
        <div>
            <label>Direction</label>
            <div class="btn-group">
                <div id="btn-long" class="btn-opt active-green" onclick="setDir('long')">LONG</div>
                <div id="btn-short" class="btn-opt" onclick="setDir('short')">SHORT</div>
            </div>
        </div>
    </div>

    <label>Entry Price</label>
    <input type="number" id="entry" step="0.25" placeholder="0.00" oninput="calculate()">

    <div class="grid">
        <div>
            <label>Target Price</label>
            <input type="number" id="tp" step="0.25" placeholder="Profit" oninput="calculate()">
        </div>
        <div>
            <label>Stop Price</label>
            <input type="number" id="sl" step="0.25" placeholder="Loss" oninput="calculate()">
        </div>
    </div>

    <label>Contracts</label>
    <input type="number" id="contracts" value="1" min="1" oninput="calculate()">

    <div class="result-box" id="resultDisplay">
        <span style="color:#64748b">Ready to trade...</span>
    </div>

    <button class="btn-clear" onclick="resetForm()">Clear All</button>

    <div class="quote-container">
        <div id="quote-text">"The goal is not to be right, but to stay green."</div>
    </div>
</div>

<script>
    let currentTicker = 'es';
    let currentType = 'standard';
    let currentDir = 'long';

    const quotes = [
        "AGAINST ALL ODDS"
        
    ];

    const specs = {
        es: { tickSize: 0.25,  stdValue: 12.50, micValue: 1.25 },
        nq: { tickSize: 0.25,  stdValue: 5.00,  micValue: 0.50 },
        si: { tickSize: 0.005, stdValue: 25.00, micValue: 5.00 },
        gc: { tickSize: 0.10,  stdValue: 10.00, micValue: 1.00 },
        cl: { tickSize: 0.01,  stdValue: 10.00, micValue: 1.00 }
    };

    function setRandomQuote() {
        const randomIndex = Math.floor(Math.random() * quotes.length);
        document.getElementById('quote-text').innerText = `"${quotes[randomIndex]}"`;
    }

    function selectAsset(ticker, el) {
        currentTicker = ticker;
        document.querySelectorAll('#assetSelector .btn-opt').forEach(c => c.classList.remove('active-blue'));
        el.classList.add('active-blue');
        updateSteps();
        calculate();
    }

    function setType(val) {
        currentType = val;
        document.getElementById('btn-std').classList.toggle('active-blue', val === 'standard');
        document.getElementById('btn-mic').classList.toggle('active-blue', val === 'micro');
        calculate();
    }

    function setDir(val) {
        currentDir = val;
        document.getElementById('btn-long').classList.toggle('active-green', val === 'long');
        document.getElementById('btn-short').classList.toggle('active-red', val === 'short');
        calculate();
    }

    function updateSteps() {
        const step = specs[currentTicker].tickSize;
        ['entry', 'tp', 'sl'].forEach(id => document.getElementById(id).step = step);
    }

    function resetForm() {
        ['entry', 'tp', 'sl'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('contracts').value = 1;
        document.getElementById('resultDisplay').innerHTML = '<span style="color:#64748b">Ready to trade...</span>';
        setRandomQuote();
    }

    function calculate() {
        const entry = parseFloat(document.getElementById('entry').value);
        const tp = parseFloat(document.getElementById('tp').value);
        const sl = parseFloat(document.getElementById('sl').value);
        const qty = parseInt(document.getElementById('contracts').value);

        if (isNaN(entry) || isNaN(tp) || isNaN(sl) || isNaN(qty)) return;

        const s = specs[currentTicker];
        const tickVal = (currentType === 'standard') ? s.stdValue : s.micValue;
        
        const tpDiff = (currentDir === 'long') ? (tp - entry) : (entry - tp);
        const slDiff = (currentDir === 'long') ? (entry - sl) : (sl - entry);
        
        const tpTicks = Math.abs(tpDiff / s.tickSize);
        const slTicks = Math.abs(slDiff / s.tickSize);
        
        const profit = tpTicks * tickVal * qty;
        const loss = slTicks * tickVal * qty;
        const rr = slDiff !== 0 ? Math.abs(tpDiff / slDiff).toFixed(2) : "0";

        document.getElementById('resultDisplay').innerHTML = `
            <div style="margin-bottom:8px">Profit: <span class="profit">+$${profit.toLocaleString(undefined, {minimumFractionDigits: 2})}</span> <small style="color:#94a3b8; display:block;">${Math.round(tpTicks)} ticks</small></div>
            <div>Risk: <span class="loss">-$${loss.toLocaleString(undefined, {minimumFractionDigits: 2})}</span> <small style="color:#94a3b8; display:block;">${Math.round(slTicks)} ticks</small></div>
            <div class="rr-line">
                <span style="font-size:0.8rem; color:#94a3b8">R:R Ratio</span>
                <span class="rr-val">${rr}:1</span>
            </div>
        `;
    }

    // Initialize
    updateSteps();
    setRandomQuote();
</script>

</body>
</html>
